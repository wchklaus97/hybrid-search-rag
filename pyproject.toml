[project]
name = "hybrid-search-rag"
version = "0.1.0"
description = "Hybrid search for Hong Kong code-mixed documents: BM25 (SQLite FTS5) + vectors (sqlite-vec) + cross-encoder rerank"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlite-vec>=0.1.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]   # multilingual embeddings + cross-encoder reranker
agent = ["agent-rag-pydantic-ai @ git+https://github.com/wchklaus97/agent-rag-pydantic-ai.git"]  # repo 3's agent
dev = ["pytest>=8"]

[project.scripts]
hrag = "hybridrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hybridrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
